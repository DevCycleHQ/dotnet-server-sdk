name: Release

# NuGet trusted publishing is tied to this workflow file, so release-please and
# the publish job both live here.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      local_release_created: ${{ steps.release.outputs.release_created }}
      local_tag_name: ${{ steps.release.outputs.tag_name }}
      cloud_release_created: ${{ steps.release.outputs['DevCycle.SDK.Server.Cloud--release_created'] }}
      cloud_tag_name: ${{ steps.release.outputs['DevCycle.SDK.Server.Cloud--tag_name'] }}
      common_release_created: ${{ steps.release.outputs['DevCycle.SDK.Server.Common--release_created'] }}
      common_tag_name: ${{ steps.release.outputs['DevCycle.SDK.Server.Common--tag_name'] }}
    steps:
      # Uses GITHUB_TOKEN, so CI does not run on the release PR by itself.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release

  publish:
    name: build, pack & publish
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # All packages released together come from the same release PR merge commit.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.local_tag_name || needs.release-please.outputs.cloud_tag_name || needs.release-please.outputs.common_tag_name }}
      # Get a short-lived NuGet API key
      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: devcycle-admin
      - name: Set Secrets
        uses: DevCycleHQ/aws-secrets-action@main
        with:
          secrets_map: '{}'
          aws_account_id: '134377926370'
      - name: Package
        run: dotnet build -c Release
      - name: Publish Local to NuGet
        if: needs.release-please.outputs.local_release_created == 'true'
        run: dotnet nuget push DevCycle.SDK.Server.Local/bin/Release/DevCycle.SDK.Server.Local.*.nupkg --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: Publish Cloud to NuGet
        if: needs.release-please.outputs.cloud_release_created == 'true'
        run: dotnet nuget push DevCycle.SDK.Server.Cloud/bin/Release/DevCycle.SDK.Server.Cloud.*.nupkg --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: Publish Common to NuGet
        if: needs.release-please.outputs.common_release_created == 'true'
        run: dotnet nuget push DevCycle.SDK.Server.Common/bin/Release/DevCycle.SDK.Server.Common.*.nupkg --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json --skip-duplicate
